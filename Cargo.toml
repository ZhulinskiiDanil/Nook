[package]
name = "nook"
version = "0.1.0"
edition = "2024"
description = "Keeps the Windows desktop clean: corners, not frames. Claude Code sorts, Nook executes."
license = "MIT"
repository = "https://github.com/ZhulinskiiDanil/Nook"

[[bin]]
name = "nook"
path = "src/bin/nook.rs"

[[bin]]
name = "nookctl"
path = "src/bin/nookctl.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
encoding_rs = "0.8.42"
png = { version = "0.18.1", default-features = false }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
